<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--so the text dosen't break-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--so it fits the phone -->
    <title>Good Wallpaper</title>
    <link rel="stylesheet" href="style.css" />
    <!--connects css files -->
  </head>
  <body>
    <header>
      <h1>Good wallpaper</h1>
    </header>
    <input
      type="text"
      id="search-box"
      placeholder="Search wallpapers..."
      onkeyup="searchImages()"
    />

    <main class="gallery-grid">
      <a href="public/images/1.webp" download>
        <img
          src="public/images/1.webp"
          alt="abstract wallpaper, liquid waves, gradient flow, motion abstract, 4k mobile wallpaper, fluid design, amoled abstract, modern aesthetic"
        />
      </a>

      <a href="public/images/2.webp" download>
        <img
          src="public/images/2.webp"
          alt="neon abstract, light curves, futuristic wallpaper, dark amoled, glowing lines, abstract motion, mobile background"
        />
      </a>

      <a href="public/images/3.webp" download>
        <img
          src="public/images/3.webp"
          alt="abstract ribbons, energy flow, dreamy abstract, pastel gradient, motion wallpaper, 4k vertical, aesthetic background"
        />
      </a>
    </main>
    <script src="script.js"></script>
  </body>
</html>
