<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--so the text dosen't break-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--so it fits the phone -->
    <title>Good Wallpaper</title>
    <link rel="stylesheet" href="style.css" />
    <!--connects css files -->
  </head>
  <body>
    <header>
      <h1>Good wallpaper</h1>
    </header>
    <input
      type="text"
      id="search-box"
      placeholder="Search wallpapers..."
      onkeyup="searchImages()"
    />

    <main class="gallery-grid">
      <a href="images/1.jpg" download>
        <img
          src="images/1.jpg"
          alt="clash of clans clash royale pekka minipekka"
        />
      </a>

      <a href="images/2.jpg" download>
        <img src="images/2.jpg" alt="Sky clouds magic" />
      </a>

      <a href="images/3.jpg" download>
        <img src="images/3.jpg" alt="Desert scenery" />
      </a>
    </main>
    <script src="script.js"></script>
  </body>
</html>
